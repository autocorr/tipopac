[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tipopac"]

[project]
name = "tipopac"
version = "0.1.0"
description = "Fit VLA tipping scans to measure zenith atmospheric opacity and noise-diode (Tcal) temperatures."
readme = "README.md"
requires-python = ">=3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Brian E. Svoboda", email = "brian.e.svoboda@gmail.com" }]
dependencies = [
    "altair[all]>=6.2.1",
    "amwrap",
    "casatools>=6.7.5.18",
    "netcdf4>=1.7.4",
    "numpy>=2.4.4",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.0.3",
    "requests-cache>=1.3.2",
    "retry-requests>=2.0.0",
    "sdmpy>=1.71.2",
    "xarray>=2024.10",
]

[project.urls]
Homepage = "https://autocorr.github.io/tipopac/"
Documentation = "https://autocorr.github.io/tipopac/"
Repository = "https://github.com/autocorr/tipopac"
Issues = "https://github.com/autocorr/tipopac/issues"

[tool.uv.sources]
amwrap = { git = "https://github.com/autocorr/amwrap" }

[dependency-groups]
dev = [
    "fastparquet>=2026.5.0",
    "ipdb>=0.13.13",
    "ipython>=9.13.0",
    "line-profiler>=5.0.2",
    "mkdocstrings[python]>=0.27",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.35",
    "zensical>=0.0.45",
]

[tool.ruff]
extend-exclude = ["vendor", "tipopac_v2.6", "amwrap", "data", ".venv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not slow and not network'"
markers = [
    "slow: integration tests requiring data/tip_test.ms",
    "network: tests exercising the live open-meteo endpoint",
    "needs_ms: slow tests reading data/tip_test.ms outside the ds_ms fixture",
    "needs_sdm: slow tests reading data/tip_test.sdm outside the ds_sdm fixture",
]
filterwarnings = [
    # netcdf4's abi3 wheel is Cython-built against an older numpy than the
    # pinned 2.4.4, so its baked-in ndarray struct size differs at runtime.
    # Benign C-ABI forward-compat warning; the netCDF round-trips still pass.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
